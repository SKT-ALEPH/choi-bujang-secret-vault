/* Keshev / Soft UI Evolution. Shared across employee app, vault and offline view. */
:root {
  color-scheme:light;
  --bg:#f6f5f0;
  --surface:#fffefa;
  --surface-raised:#ffffff;
  --surface-inset:#eeefe8;
  --text:#263b33;
  --muted:#59665e;
  --border:#d9ddd2;
  --control-border:#7f8b81;
  --accent:#345c49;
  --accent-hover:#254b39;
  --accent-soft:#e6ede3;
  --allow:#2f6248;
  --allow-soft:#e8f1e9;
  --deny:#983e32;
  --deny-soft:#faeee9;
  --challenge:#805c23;
  --challenge-soft:#f5eddc;
  --unknown:#59665e;
  --unknown-soft:#edf0e9;
  --student:var(--accent);
  --student-soft:var(--accent-soft);
  --ink:var(--text);
  --line:var(--border);
  --font-body:'Montserrat','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:24px;
  --space-6:32px;
  --space-7:48px;
  --space-8:64px;
  --radius-sm:12px;
  --radius:20px;
  --radius-lg:28px;
  --radius-pill:999px;
  --shadow-soft:0 6px 24px #263b3307,0 1px 3px #263b3304;
  --shadow-raised:0 10px 32px #263b330c,0 2px 6px #263b3305;
  --duration-press:120ms;
  --duration-hover:200ms;
  --duration-reveal:260ms;
  --ease:cubic-bezier(.2,.7,.2,1);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.65;
  color:var(--text);
  background:var(--bg);
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  min-width:0;
  min-height:100vh
}
button,input,textarea,select {
  font:inherit
}
button,a,select {
  touch-action:manipulation
}
button {
  cursor:pointer
}
button:disabled {
  cursor:not-allowed
}
a {
  color:var(--accent);
  text-underline-offset:4px
}
p {
  margin:0 0 16px;
  overflow-wrap:anywhere
}
h1,h2,h3,h4 {
  line-height:1.4;
  overflow-wrap:anywhere
}
h1 {
  font-size:1.65rem;
  letter-spacing:-.04em;
  margin:12px 0 8px
}
h2 {
  font-size:1.05rem;
  margin:0 0 24px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  letter-spacing:-.025em
}
h3 {
  font-size:1rem;
  margin:0 0 12px
}
h4 {
  font-size:.875rem;
  margin:20px 0 8px;
  color:var(--muted)
}
[hidden] {
  display:none!important
}
svg {
  display:block;
  flex:none
}
::selection {
  background:var(--accent-soft);
  color:var(--text)
}
:focus-visible {
  outline:3px solid var(--accent);
  outline-offset:4px
}
html {
  scroll-padding:24px
}
main:focus:not(:focus-visible) {
  outline:0
}
.skip-link,.skip {
  position:absolute;
  top:-100px;
  left:24px;
  z-index:30;
  padding:12px 20px;
  background:var(--surface);
  border-radius:var(--radius-sm)
}
.skip-link:focus,.skip:focus {
  top:12px
}
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  min-height:100px;
  padding:18px 40px;
  background:var(--bg);
  border-bottom:1px solid var(--border)
}
.brand {
  display:flex;
  align-items:center;
  gap:14px
}
.brand-symbol {
  width:46px;
  height:52px;
  display:grid;
  place-items:center;
  color:var(--accent)
}
.brand-symbol svg {
  width:32px;
  height:36px
}
.brand-name>span {
  display:block;
  font-family:var(--font-display);
  font-weight:500;
  font-size:2.35rem;
  line-height:1;
  letter-spacing:-.03em
}
.brand-name small {
  display:block;
  font-size:.6875rem;
  color:var(--muted);
  margin-top:8px
}
.topbar-status {
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap
}
.mode-badge {
  font-size:.75rem;
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  border-radius:var(--radius-pill);
  padding:8px 14px;
  color:var(--unknown);
  background:var(--unknown-soft);
  font-weight:600
}
.mode-badge:before {
  content:'';
  height:6px;
