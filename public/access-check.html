<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>같은 메모 접근 확인</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    main { max-width: 760px; margin: 32px auto; padding: 0 20px; }
    p { line-height: 1.7; }
    button { min-height: 44px; padding: 8px 16px; margin: 8px 8px 8px 0; font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; border: 1px solid; }
  </style>
</head>
<body>
  <main>
    <h1>같은 메모 접근 확인</h1>
    <p>A의 기존 메모 한 건을 두 계정으로 조회합니다. 메모와 계정은 변경하지 않습니다.</p>
    <p>먼저 A로 로그인하고 A 조회를 확인하세요. 같은 탭에서 자료실로 이동해 로그아웃한 뒤 B로 로그인하고 이 화면으로 돌아오세요.</p>
    <p><a href="/">자료실 로그인 화면</a></p>
    <button id="prepare" type="button">A의 본인 메모 조회 확인</button>
    <button id="compare" type="button">B로 같은 메모 조회 확인</button>
    <p id="status" role="status" aria-live="polite">로그인 상태를 확인합니다.</p>
    <pre id="result" aria-label="비밀값 없는 검증 결과"></pre>
    <p>비밀번호·토큰·메모 본문은 이 결과에 포함되지 않습니다.</p>
  </main>
  <script src="/vendor/supabase.js" defer></script>
  <script src="/access-check.js" defer></script>
</body>
</html>
